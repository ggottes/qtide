# builds both zips on every push and attaches them to a release when a tag is pushed.
#
#   push → artifacts: the three debug zips (release zips need the RELEASE_KEYSTORE secret)
#   tag v1.4 → a GitHub release with qtide-{tidal,qobuz,deezer}[-debug].mochyymodule.zip
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # the same compiler and libraries build.sh uses locally, from maven instead of a gradle cache
      - name: toolchain
        run: |
          mkdir -p .tools
          base=https://repo1.maven.org/maven2
          curl -sSLo .tools/compiler.jar "$base/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.0.21/kotlin-compiler-embeddable-2.0.21.jar"
          curl -sSLo .tools/stdlib.jar "$base/org/jetbrains/kotlin/kotlin-stdlib/2.0.21/kotlin-stdlib-2.0.21.jar"
          curl -sSLo .tools/coroutines.jar "$base/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.8.1/kotlinx-coroutines-core-jvm-1.8.1.jar"
          curl -sSLo .tools/serjson.jar "$base/org/jetbrains/kotlinx/kotlinx-serialization-json-jvm/1.7.3/kotlinx-serialization-json-jvm-1.7.3.jar"
          curl -sSLo .tools/sercore.jar "$base/org/jetbrains/kotlinx/kotlinx-serialization-core-jvm/1.7.3/kotlinx-serialization-core-jvm-1.7.3.jar"

      - name: sdk
        run: |
          echo "ANDROID_SDK=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: debug zips
        run: sh build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: qtide-debug-zips
          path: build/qtide-*-debug.mochyymodule.zip

      - name: release zip
        if: startsWith(github.ref, 'refs/tags/v') && env.KEY_B64 != ''
        env:
          KEY_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEY_B64" | base64 -d > release.jks
          RELEASE=1 KEYSTORE=release.jks KS_PASS="${{ secrets.RELEASE_KEYSTORE_PASS }}" \
            KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS }}" sh build.sh
          rm -f release.jks

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            build/qtide-tidal.mochyymodule.zip
            build/qtide-qobuz.mochyymodule.zip
            build/qtide-deezer.mochyymodule.zip
            build/qtide-tidal-debug.mochyymodule.zip
            build/qtide-qobuz-debug.mochyymodule.zip
            build/qtide-deezer-debug.mochyymodule.zip
